name: Daily 6:00 AM IST Feed Sync

on:
  schedule:
    # 00:30 UTC = 06:00 AM IST every day
    - cron: '30 0 * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from the GitHub Actions tab

jobs:
  daily-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run daily 6:00 AM IST article & repo sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python backend/scripts/run_daily_sync.py
